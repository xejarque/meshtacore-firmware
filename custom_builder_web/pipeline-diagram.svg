<svg xmlns="http://www.w3.org/2000/svg" height="auto" style="display:block;margin:1.5rem auto;max-width:820px;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif" viewBox="0 0 820 440"><defs><marker id="arrow-green" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#1a7f37" d="m0 1 10 4L0 9z"/></marker><marker id="arrow-blue" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#0969da" d="m0 1 10 4L0 9z"/></marker><marker id="arrow-gray" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#8c959f" d="m0 1 10 4L0 9z"/></marker></defs><style>.svg-card-bg{fill:var(--card-bg, #ffffff);stroke:var(--card-border, #d0d7de)}.svg-text-title{fill:var(--text-main, #1f2328);font-weight:700}.svg-text-sub{fill:var(--text-muted, #59636e)}.svg-accent-msh{fill:var(--accent, #1a7f37)}.svg-accent-mc{fill:var(--accent-blue, #0969da)}</style><rect width="816" height="436" x="2" y="2" stroke-width="1.5" class="svg-card-bg" rx="12"/><rect width="260" height="48" x="280" y="20" stroke-width="1.5" rx="8" style="fill:var(--bg-color, #f6f8fa);stroke:var(--card-border, #d0d7de)"/><text x="410" y="41" class="svg-text-title" font-size="13" text-anchor="middle">📡 Antena LoRa Externa (868 MHz)</text><text x="410" y="57" class="svg-text-sub" font-size="11" text-anchor="middle">Captura física • Mismo SF, BW y Frecuencia</text><path stroke="#8c959f" stroke-width="2" marker-end="url(#arrow-gray)" d="M410 68v30"/><rect width="100" height="18" x="360" y="74" stroke="#8c959f" class="svg-card-bg" rx="4"/><text x="410" y="86" class="svg-text-sub" font-size="9.5" font-weight="600" text-anchor="middle">Señal RF Aérea</text><rect width="420" height="92" x="200" y="102" stroke-width="2" rx="10" style="stroke:var(--accent-blue, #0969da);fill:var(--card-bg, #ffffff)"/><rect width="7" height="6" x="193" y="120" fill="#8c959f" rx="1"/><rect width="7" height="6" x="193" y="138" fill="#8c959f" rx="1"/><rect width="7" height="6" x="193" y="156" fill="#8c959f" rx="1"/><rect width="7" height="6" x="620" y="120" fill="#8c959f" rx="1"/><rect width="7" height="6" x="620" y="138" fill="#8c959f" rx="1"/><rect width="7" height="6" x="620" y="156" fill="#8c959f" rx="1"/><text x="410" y="124" class="svg-accent-mc" font-size="11" font-weight="700" letter-spacing=".08em" text-anchor="middle">NIVEL FÍSICO (PHY) • SEMTECH SX126x</text><text x="410" y="147" class="svg-text-title" font-size="15" font-weight="800" text-anchor="middle">Registro Sync Word: <tspan class="svg-accent-mc">0x14B4</tspan></text><text x="410" y="168" class="svg-text-sub" font-size="11.5" text-anchor="middle">Detecta en una sola escucha activa tanto paquetes Meshtastic (0x2B) como MeshCore (0x12)</text><text x="410" y="183" class="svg-accent-msh" font-size="10.5" font-weight="600" text-anchor="middle">Sin pérdida de paquetes de red • Desmultiplexado asíncrono en RAM</text><path fill="none" stroke="var(--accent, #1a7f37)" stroke-width="2.5" marker-end="url(#arrow-green)" d="M410 194v26H205v20"/><path fill="none" stroke="var(--accent-blue, #0969da)" stroke-width="2.5" marker-end="url(#arrow-blue)" d="M410 194v26h205v20"/><rect width="160" height="20" x="125" y="210" stroke="var(--accent, #1a7f37)" stroke-width="1.2" class="svg-card-bg" rx="4"/><text x="205" y="224" class="svg-accent-msh" font-size="10" font-weight="700" text-anchor="middle">Preámbulo 0x2B • Clave MSH</text><rect width="160" height="20" x="535" y="210" stroke="var(--accent-blue, #0969da)" stroke-width="1.2" class="svg-card-bg" rx="4"/><text x="615" y="224" class="svg-accent-mc" font-size="10" font-weight="700" text-anchor="middle">Preámbulo 0x12 • Trama MC</text><rect width="360" height="175" x="25" y="244" stroke-width="2" rx="10" style="stroke:var(--accent, #1a7f37);fill:var(--card-bg, #ffffff)"/><rect width="160" height="22" x="37" y="256" fill="rgba(26, 127, 55, 0.12)" rx="4"/><text x="117" y="271" class="svg-accent-msh" font-size="10" font-weight="800" text-anchor="middle">PRIORIDAD 1 • ZERO-LOSS</text><text x="37" y="300" class="svg-text-title" font-size="14" font-weight="700">Pipeline Meshtastic</text><text x="37" y="324" class="svg-text-title" font-size="12">1. Prueba AES-CTR contra canales locales</text><text x="37" y="344" class="svg-accent-msh" font-size="12" font-weight="700">✔ ¿Descifra con éxito? → SÍ</text><text x="37" y="366" class="svg-text-sub" font-size="11.5">• Pasa al Router MSH oficial sin retardo</text><text x="37" y="386" class="svg-text-sub" font-size="11.5">• Deduplicación circular de 160 paquetes</text><text x="37" y="406" class="svg-text-sub" font-size="11.5">• Entrega transparente a la App Oficial (BLE/USB)</text><rect width="360" height="175" x="435" y="244" stroke-width="2" rx="10" style="stroke:var(--accent-blue, #0969da);fill:var(--card-bg, #ffffff)"/><rect width="150" height="22" x="447" y="256" fill="rgba(9, 105, 218, 0.12)" rx="4"/><text x="522" y="271" class="svg-accent-mc" font-size="10" font-weight="800" text-anchor="middle">COEXISTENCIA NATIVA</text><text x="447" y="300" class="svg-text-title" font-size="14" font-weight="700">Pipeline MeshCore</text><text x="447" y="324" class="svg-text-title" font-size="12">1. Si no descifra en MSH → Parser MeshCore</text><text x="447" y="344" class="svg-accent-mc" font-size="12" font-weight="700">✔ ¿Trama MeshCore válida? → SÍ</text><text x="447" y="366" class="svg-text-sub" font-size="11.5">• Flood Relay automático con LBT y Backoff</text><text x="447" y="386" class="svg-text-sub" font-size="11.5">• Inyección en canal virtual MC: en la app</text><text x="447" y="406" class="svg-text-sub" font-size="11.5">• Respuestas directas y telemetría por consola Nexus</text></svg>