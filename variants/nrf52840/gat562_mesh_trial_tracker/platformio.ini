; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:gat562_mesh_trial_tracker]
extends = nrf52840_base
board_level = extra
board = gat562_mesh_trial_tracker
build_flags = ${nrf52840_base.build_flags}
  -UCRYPTO_AES_NO_DECRYPT ; MeshCore is default-on in this fork, which needs AES decryption (the nRF52 base compiles it out)
  -I variants/nrf52840/gat562_mesh_trial_tracker
  ; Fits the 1 MB nRF52840 flash with this fork's MeshCore+Nexus additions. Same family as
  ; thinknode_m1_meshcore_slim (which cannot fit cannedmessages/externalnotification, kept here
  ; for the joystick menu and buzzer). GPS/accelerometer/environmental sensors are cut: this
  ; unit has none. (GPS driver stays compiled: the fork's Nexus module has no
  ; -DMESHTASTIC_EXCLUDE_GPS guards yet.)
  -D EXCLUDE_EMOJI
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  ; Do NOT define MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR here: VoltageSensor (battery
  ; readings) hangs off that umbrella in this fork - prune sensor families instead via
  ; NEXUS_SENSOR_PROMICRO_WHITELIST (same mechanism as thinknode_m1_meshcore_slim).
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  ;-D GAT562_MESH_TRIAL_TRACKER
  -D PRIVATE_HW
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/gat562_mesh_trial_tracker>

; MeshCore hybrid for the GAT562 trial tracker (nRF52840 + SX1262), same flags as the
; promicro MeshCore env; the hybrid RX sync word is an SX126x feature.
[env:gat562_mesh_trial_tracker_meshcore]
extends = env:gat562_mesh_trial_tracker
board_level = extra
build_flags = ${env:gat562_mesh_trial_tracker.build_flags}
  -DMESHTASTIC_ENABLE_MESHCORE_SNIFFER=1
  -DMESHTASTIC_ENABLE_MESHCORE_RELAY=1
  -DMESHTASTIC_ENABLE_MESHCORE_COMPANION=1
  -DMESHTASTIC_ENABLE_MESHCORE_HYBRID_SYNC=1
  -UCRYPTO_AES_NO_DECRYPT ; MeshCore decrypts AES-ECB, but the nRF52 base compiles AES decrypt out and returns zeros
  -DMESHTASTIC_MESHCORE_RX_SYNCWORD=0x14B4
