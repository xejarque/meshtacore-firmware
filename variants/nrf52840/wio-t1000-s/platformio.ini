; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:wio-t1000-s]
extends = nrf52840_base
board = wio-t1000-s
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  ; GPS above 9600 baud: 2 KB ring buffers (2x the base) to absorb the unfiltered NMEA burst a chip sends before
  ; GPS.cpp has configured it. No -U here: PlatformIO emits every -D before any -U, so a -U would leave the macro
  ; undefined (64 B buffers). The later -D wins over nrf52840_base's 1024 (gcc only warns about the redefinition).
  -DSERIAL_BUFFER_SIZE=2048
  -Ivariants/nrf52840/wio-t1000-s
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DWIO_WM1110
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/wio-t1000-s>
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
upload_protocol = jlink