name: Refresh Pages firmware on release

# A release event runs from the release tag, which the github-pages environment may refuse and which would
# deploy the tag's site. Dispatching pages.yml on main refreshes the "Actualizar" firmware from the right ref.
on:
  release:
    types: [published, edited]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Run the Pages deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
