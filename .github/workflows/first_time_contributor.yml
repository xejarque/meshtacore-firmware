name: Welcome First-Time Contributor

on:
  issues:
    types: opened
  pull_request_target:
    types: opened

permissions: {}

jobs:
  welcome:
    if: github.repository == 'xejarque/meshtacore-firmware' && ((!github.event.issue) || (!contains(github.event.issue.title, '[Build Request]') && !contains(github.event.issue.body, 'meshtacore-build-config')))
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to post comments and labels on issues
      pull-requests: write # Required to post comments and labels on PRs
    steps:
      - uses: plbstl/first-contribution@2c36bdb58684587f60549a69aaa3ec00b9d5f4fe # v4.3.3
        with:
          labels: first-contribution
          issue-opened-msg: |
            ### Hola @{fc-author}, ¡gracias por escribirnos! :wave:

            Hemos recibido tu primera incidencia en Meshtacore. Cuéntanos con calma qué ha pasado:
            qué placa tienes, qué esperabas que ocurriera y qué ocurrió en realidad. Si puedes,
            añade una foto de la pantalla del aparato.

            Si lo que quieres es **instalar o actualizar** tu aparato, no hace falta abrir una
            incidencia: usa la [página de instalación](https://xejarque.github.io/meshtacore-firmware/update.html).

          pr-opened-msg: |
            ### Hola @{fc-author}, ¡gracias por tu primera contribución! :tada:

            La revisaremos en cuanto podamos. Si cambia el comportamiento del firmware,
            cuéntanos en la descripción cómo lo has probado y en qué placa.
