name: Deploy Website & Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "custom_builder_web/**"
      - ".github/workflows/pages.yml"
      - "bin/pages-firmware.sh"
  # a new published release refreshes the firmware the "Actualizar" section offers
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add the latest release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/pages-firmware.sh custom_builder_web/firmware

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./custom_builder_web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
